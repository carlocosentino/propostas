<style>
:root{--grafite:#383838;--grafite-2:#5c5c5c;--cinza:#989898;--cobre:#d0835d;--cobre-texto:#a8633f;--papel:#ffffff;--papel-2:#f6f4f1;--fio:#e3e1dd;--critico:#a63d3d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--papel-2);color:var(--grafite);font-family:"Open Sans","Segoe UI",Helvetica,Arial,sans-serif;padding:24px 16px}
.cartao{width:100%;max-width:420px;background:var(--papel);border-top:4px solid var(--cobre);box-shadow:0 1px 3px rgba(0,0,0,.12);padding:40px 32px 32px}
.cartao img{display:block;height:72px;width:auto;margin:0 0 28px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cobre-texto)}
h1{margin:0 0 12px;font-size:24px;font-weight:600;line-height:1.25}
p.texto{margin:0 0 24px;color:var(--grafite-2);font-size:15px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--fio);border-radius:4px;color:var(--grafite)}
input:focus{outline:2px solid var(--cobre);outline-offset:1px;border-color:var(--cobre)}
button{margin-top:16px;width:100%;font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:4px;background:var(--grafite);color:#fff;cursor:pointer}
button:hover{background:#2f2f2f}
button[disabled]{opacity:.6;cursor:wait}
.erro{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--critico)}
.rodape{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--fio);font-size:12px;color:var(--cinza);line-height:1.6}
</style></head>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},chave,d(P.dados));
  return new TextDecoder().decode(claro);
}
function mostrar(html){document.open();document.write(html);document.close();}
(async()=>{try{const s=sessionStorage.getItem('proposta-acesso');if(s){mostrar(await abrir(s));}}catch(_){}})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'),e=document.getElementById('e'),s=document.getElementById('s').value;
  b.disabled=true;e.textContent='';b.textContent='Abrindo…';
  try{const html=await abrir(s);try{sessionStorage.setItem('proposta-acesso',s)}catch(_){}mostrar(html);}
  catch(_){e.textContent='Senha incorreta. Confira e tente de novo.';b.disabled=false;b.textContent='Abrir a proposta';}
});
